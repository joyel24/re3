name: re3 conan+cmake
on:
  push:
  workflow_dispatch:
jobs:
  build-cmake:
    strategy:
      matrix:
        include:
          - os: 'macos-latest'
            platform: 'gl3'
            gl3_gfxlib: 'glfw'
            audio: 'openal'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: "Setup conan"
        run: |
          python -m pip install conan==1.66
          conan config init
          conan config set log.print_run_commands=True
          conan config set general.revisions_enabled=1
      - name: "Export librw conan recipe"
        run: |
          conan export vendor/librw librw/master@
      - name: "Download/build dependencies (conan install)"
        run: |
          conan install ${{ github.workspace }} re3/master@ -if build -o re3:audio=${{ matrix.audio }} -o librw:platform=${{ matrix.platform }} -o librw:gl3_gfxlib=${{ matrix.gl3_gfxlib || 'glfw' }} --build missing -pr:h ./host_profile -pr:b default -s re3:build_type=Release -s librw:build_type=Release
        env:
          CONAN_SYSREQUIRES_MODE: enabled
      - name: "Build re3 (conan build)"
        run: |
          conan build ${{ github.workspace }} -if build -bf build -pf package
      - name: "Package re3 (conan package)"
        run: |
          conan package ${{ github.workspace }} -if build -bf build -pf package
      - name: "Create binary package (cpack)"
        working-directory: ./build
        run: |
          cpack -C Release
      - name: "Archive binary package (github artifacts)"
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.os }}-${{ matrix.platform }}"
          path: build/*.zip
          if-no-files-found: error
